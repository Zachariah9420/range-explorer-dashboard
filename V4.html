<!--
  資料來源切換：
  · 開發 / 離線：保留 <script src="data-base.js"></script>（內含 window.DATA = {...}）
  · 部署 / 線上：改用 loader.js（從 dashboard.json fetch + 30s auto-refresh）
  · 兩個都掛也沒關係，loader 拉到新資料會覆蓋 data-base.js
-->
<script src="data-base.js"></script>
<script src="loader.js"></script>

<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/variant-cone-hero.jsx"></script>
<script type="text/babel">
  // Wait until DATA exists (loader.js fetches async) before first render.
  // ConeHeroVariant itself listens to DATA_UPDATED for live refreshes.
  function mount() {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.ConeHeroVariant />);
  }
  if (window.DATA) {
    mount();
  } else {
    window.addEventListener('DATA_UPDATED', mount, { once: true });
    // Fallback if no data within 5s, still mount so user sees "LOADING DATA…"
    setTimeout(() => { if (!window.__mounted) { window.__mounted = true; mount(); } }, 5000);
  }
</script>

</body>
